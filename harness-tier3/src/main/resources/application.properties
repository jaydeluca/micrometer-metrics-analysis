# Random free port; the harness reads the actual port back from the web server.
server.port=0
spring.main.banner-mode=off
logging.level.root=WARN
# In-memory H2 so the JDBC connection-pool metrics have a real DataSource to report on.
spring.datasource.url=jdbc:h2:mem:tier3;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Give the Hikari pool a stable name in the metric tags.
spring.datasource.hikari.pool-name=tier3-hikari
